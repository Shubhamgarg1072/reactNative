apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// ─── Release signing ──────────────────────────────────────────────────────────
// Read from android/keystore.properties (gitignored).
// Copy android/keystore.properties.template, fill in your values, then build.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseKeystore = keystorePropertiesFile.exists() &&
        keystoreProperties['STORE_FILE'] &&
        new File(rootProject.projectDir, keystoreProperties['STORE_FILE'].toString()).exists()

// ─── React Native config ──────────────────────────────────────────────────────
react {
    // Variants listed here are served by Metro (JS bundle is NOT pre-built).
    // All other variants pre-bundle JS at compile time.
    debuggableVariants = ["developmentDebug", "stagingDebug", "productionDebug"]
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ─── Android build config ─────────────────────────────────────────────────────
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.samplefirstappreact"

    defaultConfig {
        applicationId "com.samplefirstappreact"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    // ── Signing configs ───────────────────────────────────────────────────────
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing is only configured when keystore.properties exists
        // AND the keystore file itself is present — avoids build failures on
        // machines that only do debug/dev work.
        if (hasReleaseKeystore) {
            release {
                storeFile new File(rootProject.projectDir, keystoreProperties['STORE_FILE'].toString())
                storePassword keystoreProperties['STORE_PASSWORD']
                keyAlias keystoreProperties['KEY_ALIAS']
                keyPassword keystoreProperties['KEY_PASSWORD']
            }
        }
    }

    // ── Build types ───────────────────────────────────────────────────────────
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable true
        }
        release {
            // Fall back to debug signing when no release keystore is present.
            // Replace with signingConfigs.release once the keystore is set up.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            debuggable false
        }
    }

    // ── Product flavors — one per environment ─────────────────────────────────
    // APP_ENVIRONMENT and API_BASE_URL are injected into BuildConfig at compile
    // time. DeviceInfoModule reads them and forwards them to the JS layer.
    //
    // NOTE: app_name is intentionally NOT overridden here. It comes from
    // res/values/strings.xml. Duplicating it via resValue causes a build error.
    flavorDimensions "env"

    productFlavors {
        development {
            dimension "env"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            buildConfigField "String", "APP_ENVIRONMENT", '"development"'
            buildConfigField "String", "API_BASE_URL",    '"https://dev-api.example.com"'
            // cleartext allowed in dev so local / mock servers work
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            buildConfigField "String", "APP_ENVIRONMENT", '"staging"'
            buildConfigField "String", "API_BASE_URL",    '"https://staging-api.example.com"'
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
        production {
            dimension "env"
            buildConfigField "String", "APP_ENVIRONMENT", '"production"'
            buildConfigField "String", "API_BASE_URL",    '"https://api.example.com"'
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }

    // ── ABI splits — release builds only ─────────────────────────────────────
    // Splits are disabled in debug so `run-android` can install a single APK
    // on device without the CLI having to choose between multiple outputs.
    splits {
        abi {
            enable gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-bootsplash')

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
